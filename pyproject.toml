[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-a2a-poc"
version = "0.4.0"
description = "Typed incident coordination POC comparing rules with Laya, without generative LLMs or vLLM"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
laya = ["laya>=0.3.7,<0.4"]

[tool.setuptools.packages.find]
include = ["laya_a2a*"]
